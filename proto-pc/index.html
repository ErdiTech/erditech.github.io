<!doctype html><meta charset="utf-8"><title>pc proto</title>
<style>html,body{margin:0;background:#070d18;color:#fff;font:14px system-ui}#s{height:500vh}#st{position:sticky;top:0;height:100vh}canvas{width:100%;height:100%;display:block}#r{position:absolute;left:24px;bottom:24px;font:13px ui-monospace,monospace;letter-spacing:.06em}</style>
<div id="s"><div id="st"><canvas id="c"></canvas><div id="r">loading</div></div></div>
<script type="module">
import { mount } from '/assets/js/pc/pc.js';
const r = document.getElementById('r');
const t0 = performance.now();
const v = await mount(document.getElementById('c'), { maxDpr: +(new URLSearchParams(location.search).get('dpr') || 1.5), url: '/assets/film/pc/cloud-d.bin', onReadout: (d, t) => { r.textContent = 'RANGE ' + d.toFixed(1) + ' m  ·  ' + (t*100).toFixed(0) + '%'; } });
window.__pc = v; window.__pcReady = performance.now() - t0;
const upd = () => { const s = document.getElementById('s'); const p = scrollY / (s.offsetHeight - innerHeight); v.setProgress(p); };
addEventListener('scroll', upd, { passive: true }); upd();
</script>
